<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Power Strip Safety Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f11;
    --panel: #15181b;
    --panel-alt: #1a1e22;
    --grid-line: #23282d;
    --text: #e7eaec;
    --dim: #737d85;
    --amber: #ffb020;
    --green: #34d17f;
    --orange: #ff8a1f;
    --red: #ff4d4d;
    --switch-off: #363c42;
    --font-head: "Space Grotesk", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, var(--grid-line) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, var(--grid-line) 40px),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-head);
    padding: 40px 20px 60px;
  }
  a, button, input { font-family: inherit; }

  .console { max-width: 900px; margin: 0 auto; }

  .masthead { margin-bottom: 28px; }
  .masthead .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--amber);
    letter-spacing: 2px;
    margin: 0 0 8px;
  }
  .masthead h1 {
    font-size: 32px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.5px;
  }
  .masthead p {
    color: var(--dim);
    font-size: 14px;
    margin: 8px 0 0;
    max-width: 480px;
    line-height: 1.6;
  }

  .control-grid {
    display: grid;
    grid-template-columns: 1fr 1.15fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 700px) {
    .control-grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--grid-line);
    border-radius: 6px;
    padding: 18px;
  }
  .card-title {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--dim);
    margin: 0 0 14px;
  }

  /* --- Breaker panel: physical rocker switches --- */
  .switch-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--grid-line);
  }
  .switch-row:last-child { border-bottom: none; }
  .switch-row .name { font-size: 14px; flex: 1; }
  .switch-row .watt {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--dim);
  }
  .switch-row input[type="checkbox"] {
    appearance: none;
    width: 42px;
    height: 22px;
    background: var(--switch-off);
    border-radius: 11px;
    position: relative;
    cursor: pointer;
    outline: none;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .switch-row input[type="checkbox"]::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #0d0f11;
    transition: transform 0.2s;
  }
  .switch-row input[type="checkbox"]:checked {
    background: var(--green);
  }
  .switch-row input[type="checkbox"]:checked::after {
    transform: translateX(20px);
  }
  .switch-row input[type="checkbox"]:focus-visible {
    box-shadow: 0 0 0 2px var(--amber);
  }

  /* --- Instrument cluster: gauges + digital readouts --- */
  .gauge { margin-bottom: 16px; }
  .gauge:last-child { margin-bottom: 0; }
  .gauge-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .gauge-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--dim);
  }
  .gauge-value {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 600;
  }
  .gauge-track {
    position: relative;
    height: 10px;
    border-radius: 5px;
    overflow: visible;
  }
  .gauge-track.zone-load {
    background: linear-gradient(to right,
      var(--green) 0%, var(--green) 53%,
      var(--amber) 53%, var(--amber) 67%,
      var(--red) 67%, var(--red) 100%);
  }
  .gauge-track.zone-temp {
    background: linear-gradient(to right,
      var(--green) 0%, var(--green) 49%,
      var(--amber) 49%, var(--amber) 75%,
      var(--red) 75%, var(--red) 100%);
  }
  .gauge-track { opacity: 0.35; }
  .gauge-pointer {
    position: absolute;
    top: -4px;
    width: 3px;
    height: 18px;
    background: var(--text);
    border-radius: 2px;
    left: 0%;
    transition: left 0.6s linear;
  }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .stat {
    background: var(--bg);
    border: 1px solid var(--grid-line);
    border-radius: 4px;
    padding: 10px 12px;
  }
  .stat .gauge-label { margin-bottom: 4px; }
  .stat .gauge-value { font-size: 16px; }

  /* --- Alert strip: the one bold moment --- */
  .alert-strip {
    padding: 16px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 16px;
    border: 1px solid transparent;
    transition: background 0.4s, border-color 0.4s, color 0.4s;
  }
  .alert-strip.NORMAL { background: rgba(52,209,127,0.10); border-color: var(--green); color: var(--green); }
  .alert-strip.YELLOW { background: rgba(255,176,32,0.10); border-color: var(--amber); color: var(--amber); }
  .alert-strip.ORANGE { background: rgba(255,138,31,0.14); border-color: var(--orange); color: var(--orange); animation: pulse 1.4s ease-in-out infinite; }
  .alert-strip.RED { background: rgba(255,77,77,0.16); border-color: var(--red); color: var(--red); animation: pulse 0.7s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,77,0.0); }
    50% { box-shadow: 0 0 0 4px rgba(255,77,77,0.12); }
  }

  /* --- Console: AI teaching assistant, now full-width --- */
  .console-card { padding: 0; overflow: hidden; }
  .console-header {
    padding: 12px 18px;
    border-bottom: 1px solid var(--grid-line);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
  }
  .console-log {
    height: 160px;
    overflow-y: auto;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 14px;
  }
  .console-log::-webkit-scrollbar { width: 6px; }
  .console-log::-webkit-scrollbar-thumb { background: var(--grid-line); border-radius: 3px; }
  .console-msg { line-height: 1.6; }
  .console-msg.self { color: var(--dim); }
  .console-input-row {
    display: flex;
    border-top: 1px solid var(--grid-line);
  }
  .console-input-row input {
    flex: 1;
    background: var(--panel-alt);
    border: none;
    color: var(--text);
    padding: 12px 18px;
    font-size: 14px;
  }
  .console-input-row input:focus { outline: none; background: #1f2429; }
  .console-input-row button {
    background: var(--panel-alt);
    border: none;
    border-left: 1px solid var(--grid-line);
    color: var(--amber);
    padding: 0 20px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
  }

  /* --- Footer: finish + score --- */
  .footer-card { margin-top: 16px; }
  #finish-btn {
    width: 100%;
    padding: 13px;
    background: var(--panel-alt);
    color: var(--text);
    border: 1px solid var(--grid-line);
    border-radius: 4px;
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  #finish-btn:hover { border-color: var(--amber); }
  #score-panel {
    display: none;
    margin-top: 16px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 2;
  }
  #score-panel .total {
    margin-top: 8px;
    font-size: 22px;
    color: var(--amber);
    font-family: var(--font-head);
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="console">

  <div class="masthead">
    <p class="eyebrow">SIMULATION — 10A CIRCUIT</p>
    <h1>Power Strip Safety Console</h1>
    <p>Turn the device on/off, view live load and temperature, and see when limits are exceeded.</p>
  </div>

  <div class="alert-strip NORMAL" id="alert-bar">All is well.</div>

  <div class="control-grid">

    <div class="card">
      <p class="card-title">BREAKER PANEL</p>
      <div id="appliance-list"></div>
    </div>

    <div class="card">
      <p class="card-title">INSTRUMENT CLUSTER</p>

      <div class="gauge">
        <div class="gauge-top">
          <span class="gauge-label">LOAD</span>
          <span class="gauge-value" id="val-load">0 %</span>
        </div>
        <div class="gauge-track zone-load">
          <div class="gauge-pointer" id="ptr-load"></div>
        </div>
      </div>

      <div class="gauge">
        <div class="gauge-top">
          <span class="gauge-label">TEMPERATURE</span>
          <span class="gauge-value" id="val-temp">25.0 °C</span>
        </div>
        <div class="gauge-track zone-temp">
          <div class="gauge-pointer" id="ptr-temp"></div>
        </div>
      </div>

      <div class="stat-row">
        <div class="stat">
          <div class="gauge-label">CURRENT</div>
          <div class="gauge-value" id="val-current">0.00 A</div>
        </div>
        <div class="stat">
          <div class="gauge-label">TOTAL POWER</div>
          <div class="gauge-value" id="val-power">0 W</div>
        </div>
      </div>
    </div>

  </div>

  <div class="card console-card">
    <div class="console-header">
      <span>AI TEACHING ASSISTANT</span>
      <span>ONLINE (RULE-BASED)</span>
    </div>
    <div class="console-log" id="assistant-log"></div>
    <div class="console-input-row">
      <input type="text" id="assistant-input" placeholder="Ask a question, e.g., What is an overload?" />
      <button id="assistant-send">Send</button>
    </div>
  </div>

  <div class="card footer-card">
    <button id="finish-btn">Finish Simulation — View Score</button>
    <div id="score-panel"></div>
  </div>

</div>

<script src="../engine/circuitEngine.js"></script>
<script src="../engine/temperatureEngine.js"></script>
<script src="../rules/alertSystem.js"></script>
<script src="../scoring/scoreEngine.js"></script>
<script src="../ai/aiAssistant.js"></script>
<script src="app.js"></script>
</body>
</html>
